<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>itShop - Главная</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">itShop</div>
            <div class="navbar-menu">
                <a href="/" class="nav-link active">Главная</a>
                <a href="/about" class="nav-link">Про нас</a>
                <div sec:authorize="!isAuthenticated()">
                    <a href="/login" class="nav-link">Войти</a>
                    <a href="/register" class="nav-link">Регистрация</a>
                </div>
                <div sec:authorize="isAuthenticated()">
                    <a href="/user" class="nav-link">Кабинет</a>
                    <a href="/admin" th:if="${#authorization.expression('hasRole(\"ADMIN\")')}" class="nav-link">Панель админа</a>
                    <form action="/logout" method="POST" style="display:inline;">
                        <button type="submit" class="nav-link logout-btn">Выйти</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="hero">
        <h1>Хочешь выглядеть стильно?</h1>
        <p>Здесь вы найдете крутые и стильные вещи для себя</p>
        <small>#прогер</small>
    </div>

    <div class="container products">
        <div th:if="${#lists.isEmpty(products)}" class="empty-message">
            <p>Товаров пока нет</p>
        </div>
        <div class="products-grid">
            <div th:each="product : ${products}" class="product-card">
                <div class="product-name" th:text="${product.name}">Товар</div>
                <div class="product-description" th:text="${product.description}">Описание</div>
                <div class="product-price" th:text="'$' + ${product.price}">$0</div>
                <div class="product-author" th:text="'Автор: ' + ${product.author.username}">Автор</div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 itShop. Все права защищены.</p>
        <p>#прогер @прогер</p>
    </footer>
</body>
</html>
